<div class="main-container">

  <!-- Left Side: Full Cover Image -->
  <div class="image-container">
    <img src="assets/images/home3.jpg" alt="Background Image" />
  </div>

  <!-- Right Side: Content Boxes -->
  <div class="right-container">
    
    <!-- Weekly Timesheet Generator -->
    <div class="neon-box">
      <h1>Weekly Timesheet Generator</h1>
      <div class="upload-section">
        <input type="file" id="weeklyFile" (change)="onWeeklyFileUpload($event)" multiple accept=".xlsx, .xls" />
        <label for="weeklyFile">📤 Upload Weekly Timesheet</label>
      </div>
      <div class="file-list" *ngIf="uploadedFilesCount > 0">
        <h3>Uploaded Weekly Files</h3>
        <div *ngFor="let file of uploadedFileNames">{{ file }}</div>
      </div>
      <button (click)="generateWeeklySummary()">Generate Weekly File</button>
    </div>
